<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>S-Link · Admin Provider Monitor</title>
  <style>
    :root {
      --bg: #F4F6FB;
      --panel: #FFFFFF;
      --card: #FFFFFF;
      --text: #0F172A;
      --text-soft: #475569;
      --muted: #94A3B8;
      --border: #E2E8F0;
      --green: #10B981;
      --amber: #F59E0B;
      --red: #EF4444;
      --blue: #2563EB;
      --accent: #2563EB;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: #FFFFFF;
      color: var(--text);
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 0 rgba(15,23,42,0.02);
    }
    header h1 { margin: 0; font-size: 20px; letter-spacing: -0.2px; }
    header p { margin: 4px 0 0; color: var(--text-soft); font-size: 13px; }
    .badge-pill {
      background: #EEF2FF;
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #DBEAFE;
    }
    .btn {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(37,99,235,0.25);
    }
    .btn:hover { filter: brightness(1.05); }
    .layout {
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      height: calc(100vh - 84px);
    }
    aside {
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow: auto;
      padding: 16px;
      color: var(--text);
    }
    #map { width: 100%; height: 100%; background: #EEF2F7; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    }
    .stat span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; }
    .stat strong { display: block; font-size: 22px; color: var(--text); margin-top: 4px; }
    .small { font-size: 12px; color: var(--text-soft); margin-top: 8px; }
    .provider {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 18px;
      padding: 14px;
      margin: 12px 0;
      box-shadow: 0 1px 2px rgba(15,23,42,0.04);
    }
    .provider h3 { margin: 0; font-size: 15px; color: var(--text); }
    .provider p { margin: 6px 0 0; color: var(--text-soft); font-size: 12.5px; line-height: 1.35; }
    .row { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .badge {
      border-radius: 999px;
      color: white;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge.available { background: var(--green); }
    .badge.busy { background: var(--amber); }
    .badge.offline { background: var(--red); }
    .badge.pending {
      background: #FEF3C7;
      color: #92400E;
      border: 1px solid #FCD34D;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .chip {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-soft);
      cursor: pointer;
      transition: all 120ms ease;
    }
    .chip:hover { border-color: #94A3B8; color: var(--text); }
    .chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(37,99,235,0.25);
    }
    .chip .count {
      margin-left: 6px;
      opacity: 0.7;
      font-weight: 500;
    }

    .provider.focused {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15), 0 1px 2px rgba(15,23,42,0.04);
    }
    .provider {
      cursor: pointer;
    }
    .following-banner {
      background: linear-gradient(135deg, #2563EB, #4F46E5);
      color: white;
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 12.5px;
      font-weight: 600;
      display: none;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
    }
    .following-banner.active { display: flex; }
    .following-banner button {
      background: rgba(255,255,255,0.15);
      border: 0;
      color: white;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Bolt-style pulsing pin overlay */
    .pulse-marker {
      position: absolute;
      width: 0;
      height: 0;
      pointer-events: none;
      /* --pulse: ring color (always blue for the live presence vibe) */
      /* color  : dot fill (varies by provider status) */
      --pulse: #2563EB;
    }
    .pulse-marker .pulse-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 60px;
      height: 60px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--pulse);
      opacity: 0.35;
      animation: slPulse 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    .pulse-marker .pulse-ring.delay { animation-delay: 0.6s; }
    .pulse-marker .pulse-ring.delay2 { animation-delay: 1.2s; }
    .pulse-marker .pulse-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12px;
      height: 12px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #2563EB;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.95), 0 3px 10px rgba(15,23,42,0.18);
      pointer-events: auto;
      cursor: pointer;
      transition: width 180ms ease, height 180ms ease, box-shadow 180ms ease;
    }
    .pulse-marker.focused .pulse-dot {
      width: 18px;
      height: 18px;
      box-shadow: 0 0 0 5px rgba(255,255,255,0.95), 0 0 0 8px rgba(37,99,235,0.4), 0 6px 18px rgba(15,23,42,0.25);
    }
    .pulse-marker.focused .pulse-ring {
      animation-duration: 1.2s;
    }
    .pulse-marker .pulse-tooltip {
      position: absolute;
      left: 50%;
      bottom: calc(50% + 18px);
      transform: translateX(-50%);
      background: #0F172A;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 120ms ease;
      pointer-events: none;
      box-shadow: 0 6px 18px rgba(15,23,42,0.18);
    }
    .pulse-marker:hover .pulse-tooltip { opacity: 1; }
    @keyframes slPulse {
      0%   { transform: translate(-50%, -50%) scale(0.4); opacity: 0.55; }
      80%  { transform: translate(-50%, -50%) scale(1.4); opacity: 0; }
      100% { transform: translate(-50%, -50%) scale(1.4); opacity: 0; }
    }
    .job {
      background: #ECFDF5;
      border: 1px solid #A7F3D0;
      border-radius: 14px;
      padding: 10px;
      margin-top: 10px;
      font-size: 12.5px;
      color: #065F46;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; height: auto; }
      #map { height: 55vh; }
    }
  </style>
</head>
<body>
<header>
  <div>
    <h1>S-Link · Live Provider Monitor</h1>
    <p>Real-time view of every active provider, their last GPS update and job status.</p>
  </div>
  <div style="display:flex; gap:10px; align-items:center;">
    <span class="badge-pill" id="updated-pill">Loading…</span>
    <button class="btn" onclick="loadLocations()">Refresh now</button>
  </div>
</header>
<div class="layout">
  <aside>
    <div class="stats">
      <div class="stat"><span>Total</span><strong id="total">0</strong></div>
      <div class="stat"><span>Available</span><strong id="available">0</strong></div>
      <div class="stat"><span>Busy</span><strong id="busy">0</strong></div>
    </div>
    <div class="following-banner" id="followingBanner">
      <span id="followingText">Following…</span>
      <button onclick="stopFollowing()">Stop following</button>
    </div>
    <div class="filters" id="filters"></div>
    <div class="small" id="updated">Loading provider locations…</div>
    <div id="list"></div>
  </aside>
  <main><div id="map"></div></main>
</div>

<script>
  const GMAPS_KEY = 'AIzaSyAyJb-xED-qEcJ1D8LQNFoaxFzZJMKLDms';

  // Bolt-inspired light theme — crisp roads, soft greens for parks,
  // visible neighborhood labels. Tuned to read well at city zoom (12-14).
  const LIGHT_STYLE = [
    {"elementType":"geometry","stylers":[{"color":"#F1F5F9"}]},
    {"elementType":"labels.icon","stylers":[{"visibility":"off"}]},
    {"elementType":"labels.text.fill","stylers":[{"color":"#334155"}]},
    {"elementType":"labels.text.stroke","stylers":[{"color":"#FFFFFF"},{"weight":3}]},
    {"featureType":"administrative.country","elementType":"geometry.stroke","stylers":[{"color":"#94A3B8"}]},
    {"featureType":"administrative.locality","elementType":"labels.text.fill","stylers":[{"color":"#0F172A"},{"weight":600}]},
    {"featureType":"administrative.neighborhood","elementType":"labels.text.fill","stylers":[{"color":"#475569"}]},
    {"featureType":"administrative.land_parcel","stylers":[{"visibility":"off"}]},
    {"featureType":"poi","elementType":"labels","stylers":[{"visibility":"off"}]},
    {"featureType":"poi.park","elementType":"geometry","stylers":[{"color":"#DCFCE7"}]},
    {"featureType":"poi.business","stylers":[{"visibility":"off"}]},
    {"featureType":"landscape.natural","elementType":"geometry","stylers":[{"color":"#ECFDF5"}]},
    {"featureType":"road","elementType":"geometry","stylers":[{"color":"#FFFFFF"}]},
    {"featureType":"road","elementType":"geometry.stroke","stylers":[{"color":"#CBD5E1"}]},
    {"featureType":"road","elementType":"labels.text.fill","stylers":[{"color":"#475569"}]},
    {"featureType":"road.arterial","elementType":"geometry","stylers":[{"color":"#FFFFFF"}]},
    {"featureType":"road.highway","elementType":"geometry","stylers":[{"color":"#FFE4A8"}]},
    {"featureType":"road.highway","elementType":"geometry.stroke","stylers":[{"color":"#F59E0B"}]},
    {"featureType":"road.local","elementType":"labels.text.fill","stylers":[{"color":"#64748B"}]},
    {"featureType":"transit","stylers":[{"visibility":"off"}]},
    {"featureType":"water","elementType":"geometry","stylers":[{"color":"#BFDBFE"}]},
    {"featureType":"water","elementType":"labels.text.fill","stylers":[{"color":"#1E40AF"}]}
  ];

  let map;
  let infoWindow;
  let markersById = new Map();

  function statusToColor(s, verified) {
    if (verified === false) return '#94A3B8'; // pending verification
    if (s === 'available') return '#10B981';
    if (s === 'busy') return '#F59E0B';
    return '#EF4444';
  }

  // Custom Google Maps overlay that renders a pulsing HTML/CSS dot at a
  // LatLng — gives us a true Bolt-style "live presence" beacon instead of
  // a static SVG icon.
  let PulseMarkerClass = null;
  function definePulseMarker() {
    class PulseMarker extends google.maps.OverlayView {
      constructor(opts) {
        super();
        this.position = opts.position;
        this.color = opts.color || '#10B981';
        this.title = opts.title || '';
        this.onClick = opts.onClick || null;
        this.div = null;
      }
      onAdd() {
        const el = document.createElement('div');
        el.className = 'pulse-marker';
        el.style.color = this.color;
        el.innerHTML = `
          <div class="pulse-ring"></div>
          <div class="pulse-ring delay"></div>
          <div class="pulse-ring delay2"></div>
          <div class="pulse-dot" title="${this.title}"></div>
          <div class="pulse-tooltip">${this.title}</div>
        `;
        this.div = el;
        const dot = el.querySelector('.pulse-dot');
        if (this.onClick) {
          dot.addEventListener('click', (e) => {
            e.stopPropagation();
            this.onClick();
          });
        }
        const panes = this.getPanes();
        panes.overlayMouseTarget.appendChild(el);
      }
      draw() {
        if (!this.div) return;
        const projection = this.getProjection();
        if (!projection) return;
        const point = projection.fromLatLngToDivPixel(
          new google.maps.LatLng(this.position.lat, this.position.lng)
        );
        if (!point) return;
        this.div.style.left = point.x + 'px';
        this.div.style.top = point.y + 'px';
      }
      onRemove() {
        if (this.div && this.div.parentNode) {
          this.div.parentNode.removeChild(this.div);
        }
        this.div = null;
      }
      setPosition(pos) {
        this.position = pos;
        this.draw();
      }
      setColor(color) {
        this.color = color;
        if (this.div) this.div.style.color = color;
      }
      setFocused(isFocused) {
        if (!this.div) return;
        this.div.classList.toggle('focused', !!isFocused);
      }
      setTitle(title) {
        this.title = title;
        if (this.div) {
          const dot = this.div.querySelector('.pulse-dot');
          const tip = this.div.querySelector('.pulse-tooltip');
          if (dot) dot.title = title;
          if (tip) tip.textContent = title;
        }
      }
    }
    PulseMarkerClass = PulseMarker;
  }

  function providerHtml(p) {
    const job = p.active_job
      ? `<div class="job"><strong>Job #${p.active_job.id}</strong> · ${p.active_job.status}<br>${p.active_job.service} at ${p.active_job.address}<br>Customer: ${p.active_job.customer}${p.active_job.quoted_price ? `<br>Quote: KSh ${p.active_job.quoted_price}` : ''}</div>`
      : '';
    const lastSeen = p.last_seen ? `${p.minutes_since_seen} min ago` : 'base location only';
    const pending = p.verified === false
      ? '<span class="badge pending" style="margin-left:6px">Pending verification</span>'
      : '';
    const focusedCls = p.provider_id === followingId ? ' focused' : '';
    return `<section class="provider${focusedCls}" data-id="${p.provider_id}" onclick="focusProvider(${p.provider_id})"><div class="row"><div><h3>${p.name}</h3><p>${p.category} · ${p.tier.toUpperCase()} · ⭐ ${p.rating_avg}</p></div><div><span class="badge ${p.status}">${p.status}</span>${pending}</div></div><div class="small">${p.location_source.replace('_', ' ')} · ${lastSeen}</div>${job}</section>`;
  }

  let activeCategory = 'all';   // category name or 'all'
  let followingId = null;       // provider_id we're tracking, or null
  let lastPayload = null;       // most recent JSON, used by filter / follow

  function setCategoryFilter(cat) {
    activeCategory = cat;
    if (lastPayload) renderPayload(lastPayload);
  }

  function focusProvider(id) {
    if (followingId === id) {
      stopFollowing();
      return;
    }
    followingId = id;
    if (lastPayload) renderPayload(lastPayload);
  }

  function stopFollowing() {
    followingId = null;
    if (lastPayload) renderPayload(lastPayload);
  }

  function initMap() {
    map = new google.maps.Map(document.getElementById('map'), {
      center: { lat: -1.286389, lng: 36.817223 },
      zoom: 13,
      minZoom: 3,
      maxZoom: 18,
      styles: LIGHT_STYLE,
      disableDefaultUI: true,
      zoomControl: true,
      backgroundColor: '#F1F5F9',
      gestureHandling: 'greedy',
    });
    definePulseMarker();
    infoWindow = new google.maps.InfoWindow();
    loadLocations();
    setInterval(loadLocations, 15000);
  }

  async function loadLocations() {
    let data;
    try {
      const res = await fetch('/api/services/admin/monitor/providers/live/', { credentials: 'same-origin' });
      if (!res.ok) {
        document.getElementById('updated').textContent = 'Unable to load locations. Confirm you are logged in as staff/admin.';
        return;
      }
      data = await res.json();
    } catch (err) {
      document.getElementById('updated').textContent = 'Network error: ' + err;
      return;
    }
    lastPayload = data;
    renderPayload(data);
  }

  function renderPayload(data) {
    const allProviders = data.providers || [];

    // Build category chip list dynamically (counts per category).
    const counts = new Map();
    allProviders.forEach(p => {
      const c = p.category || 'Unassigned';
      counts.set(c, (counts.get(c) || 0) + 1);
    });
    const cats = Array.from(counts.keys()).sort();
    const filtersEl = document.getElementById('filters');
    if (filtersEl) {
      const chips = [`<button class="chip${activeCategory==='all'?' active':''}" onclick="setCategoryFilter('all')">All <span class="count">${allProviders.length}</span></button>`];
      cats.forEach(c => {
        chips.push(`<button class="chip${activeCategory===c?' active':''}" onclick="setCategoryFilter(${JSON.stringify(c)})">${c} <span class="count">${counts.get(c)}</span></button>`);
      });
      filtersEl.innerHTML = chips.join('');
    }

    // Followed banner.
    const banner = document.getElementById('followingBanner');
    const bannerText = document.getElementById('followingText');
    if (followingId !== null) {
      const target = allProviders.find(p => p.provider_id === followingId);
      if (target) {
        banner.classList.add('active');
        bannerText.textContent = `Following ${target.name}`;
      } else {
        banner.classList.remove('active');
      }
    } else {
      banner.classList.remove('active');
    }

    // Apply category filter for the sidebar list + map markers.
    const visible = activeCategory === 'all'
      ? allProviders
      : allProviders.filter(p => (p.category || 'Unassigned') === activeCategory);

    let available = 0;
    let busy = 0;
    const list = document.getElementById('list');
    list.innerHTML = '';
    const bounds = new google.maps.LatLngBounds();

    const seen = new Set();
    visible.forEach(p => {
      if (p.status === 'available') available += 1;
      if (p.status === 'busy') busy += 1;
      list.insertAdjacentHTML('beforeend', providerHtml(p));

      if (p.lat == null || p.lng == null) return;

      const position = { lat: p.lat, lng: p.lng };
      const id = p.provider_id;
      let marker = markersById.get(id);
      const color = statusToColor(p.status, p.verified);
      const titleText = `${p.name} · ${p.status}`;
      if (!marker) {
        marker = new PulseMarkerClass({
          position,
          color,
          title: titleText,
          onClick: () => focusProvider(id),
        });
        marker.setMap(map);
        markersById.set(id, marker);
      } else {
        marker.setColor(color);
        marker.setTitle(titleText);
        marker.setPosition(position);
      }
      marker.setFocused(followingId === id);
      bounds.extend(position);
      seen.add(id);
    });

    // Drop providers that are no longer visible (filtered out or gone).
    for (const [id, marker] of markersById.entries()) {
      if (!seen.has(id)) {
        marker.setMap(null);
        markersById.delete(id);
      }
    }

    document.getElementById('total').textContent = visible.length;
    document.getElementById('available').textContent = available;
    document.getElementById('busy').textContent = busy;
    const ts = new Date(data.generated_at).toLocaleString();
    document.getElementById('updated').textContent = `Last refreshed: ${ts}`;
    document.getElementById('updated-pill').textContent = `Updated ${new Date(data.generated_at).toLocaleTimeString()}`;

    // Camera behaviour:
    //  * Following a provider → keep them centered at zoom 15.
    //  * Otherwise → fit all visible markers, zoom-capped sensibly.
    if (followingId !== null) {
      const target = visible.find(p => p.provider_id === followingId);
      if (target && target.lat != null && target.lng != null) {
        map.panTo({ lat: target.lat, lng: target.lng });
        if (map.getZoom() < 15) map.setZoom(15);
      }
    } else if (!bounds.isEmpty()) {
      if (visible.length === 1) {
        const only = visible[0];
        if (only.lat != null && only.lng != null) {
          map.setCenter({ lat: only.lat, lng: only.lng });
          map.setZoom(14);
        }
      } else {
        map.fitBounds(bounds, 80);
        google.maps.event.addListenerOnce(map, 'idle', () => {
          if (map.getZoom() > 15) map.setZoom(15);
        });
      }
    } else {
      map.setCenter({ lat: -1.286389, lng: 36.817223 });
      map.setZoom(12);
    }
  }

  (function loadGmaps() {
    const s = document.createElement('script');
    s.src = `https://maps.googleapis.com/maps/api/js?key=${GMAPS_KEY}&callback=initMap&v=weekly`;
    s.async = true;
    s.defer = true;
    document.head.appendChild(s);
    window.initMap = initMap;
  })();
</script>
</body>
</html>
