version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: s_link_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: s_link
      POSTGRES_USER: s_link
      POSTGRES_PASSWORD: s_link
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: s_link_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: s_link_backend
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      DJANGO_SECRET_KEY: dev-secret-key-change-me
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_DB: s_link
      POSTGRES_USER: s_link
      POSTGRES_PASSWORD: s_link
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MPESA_CONSUMER_KEY: dummy_consumer_key
      MPESA_CONSUMER_SECRET: dummy_consumer_secret
      MPESA_SHORTCODE: "123456"
      MPESA_PASSKEY: dummy_passkey
      MPESA_CALLBACK_URL: "https://example.com/api/payments/mpesa/callback/"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: s_link_celery
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      DJANGO_SECRET_KEY: dev-secret-key-change-me
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_DB: s_link
      POSTGRES_USER: s_link
      POSTGRES_PASSWORD: s_link
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    command: celery -A s_link_backend worker -l info
    volumes:
      - ./backend:/app

volumes:
  postgres_data:

