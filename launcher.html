<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>S-Link — Open app</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: #e5e7eb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #1a1a1a;
    }
    h1 { font-size: 1.75rem; margin-bottom: 8px; color: #0082d6; }
    p { color: #6b7280; margin-bottom: 32px; font-size: 1rem; }
    .links { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 320px; }
    a {
      display: block;
      padding: 20px 24px;
      background: #fff;
      border-radius: 16px;
      text-decoration: none;
      color: #1a1a1a;
      font-weight: 600;
      font-size: 1.1rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    a:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,0.12); }
    a span { display: block; font-size: 0.85rem; font-weight: 400; color: #6b7280; margin-top: 4px; }
    .customer { border-left: 4px solid #0082d6; }
    .provider { border-left: 4px solid #00a651; }
  </style>
</head>
<body>
  <h1>S-Link</h1>
  <p>Choose which app to open</p>
  <div class="links">
    <a href="customer.html" class="customer">Customer app<span>Request services, find providers, pay with M-Pesa</span></a>
    <a href="provider.html" class="provider">Service provider app<span>Onboarding, dashboard, jobs & earnings</span></a>
  </div>
</body>
</html>
