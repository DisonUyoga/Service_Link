name: s_link_mobile
description: S-Link service marketplace mobile app (Flutter)
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.0.0
  dio: ^5.4.0
  google_maps_flutter: ^2.6.0
  geolocator: ^10.0.0
  speech_to_text: ^7.3.0
  firebase_core: ^3.5.0
  firebase_database: ^11.1.0
  shared_preferences: ^2.3.2
  google_sign_in: ^6.2.1
  file_picker: ^8.0.0
  permission_handler: ^11.3.1
  firebase_messaging: ^15.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/s-link.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/s-link.png"
